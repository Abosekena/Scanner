<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ باركود GS1 مع تصدير إكسيل متطور</title>
    <!-- استخدام Tailwind CSS لتصميم سريع وجميل -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة قراءة الباركود Html5-Qrcode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- مكتبة SheetJS لتصدير ملفات Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-4">

    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 space-y-6">
        <h2 class="text-2xl font-bold text-center text-gray-800">ماسح باركود GS1 المتعدد</h2>
        
        <!-- أزرار التحكم بالكاميرا -->
        <div class="text-center space-y-2">
            <button id="start-btn" onclick="startScanner()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg w-full transition duration-200">
                📷 ابدأ مسح الباركود
            </button>
            <button id="stop-btn" onclick="stopScanner()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg w-full hidden transition duration-200">
                🛑 إيقاف الكاميرا
            </button>
        </div>

        <!-- مكان ظهور الكاميرا -->
        <div id="reader" class="w-full rounded-lg overflow-hidden"></div>

        <!-- آخر نتيجة تم مسحها -->
        <div id="result-container" class="hidden bg-gray-50 border border-gray-200 rounded-lg p-4 shadow-inner space-y-3">
            <h3 class="text-md font-semibold text-gray-700 border-b pb-1">📦 آخر قطـعة تم مسحها:</h3>
            <div class="space-y-1 text-xs text-gray-600">
                <p><strong>الباركود الخام:</strong> <span id="raw-data" class="text-black font-mono break-all"></span></p>
                <p><strong>GTIN:</strong> <span id="gtin-val" class="text-blue-600 font-mono font-bold"></span> | 
                   <strong>الصلاحية:</strong> <span id="expiry-val" class="text-green-600 font-mono font-bold"></span> | 
                   <strong>LOT (آخر 8 أرقام):</strong> <span id="batch-val" class="text-purple-600 font-mono font-bold"></span></p>
            </div>
        </div>

        <!-- قسم الجدول والتحكم بالقائمة المسجلة -->
        <div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="text-lg font-semibold text-gray-800">📋 قائمة القطع المسجلة (<span id="items-count">0</span>)</h3>
                <button onclick="clearAllItems()" class="text-red-500 hover:text-red-700 text-sm font-bold transition">حذف الكل 🗑️</button>
            </div>

            <!-- جدول البيانات -->
            <div class="overflow-x-auto max-h-60 overflow-y-auto border border-gray-100 rounded">
                <table class="w-full text-right text-xs">
                    <thead class="bg-gray-100 text-gray-700 sticky top-0">
                        <tr>
                            <th class="p-2">#</th>
                            <th class="p-2">GTIN</th>
                            <th class="p-2">الصلاحية</th>
                            <th class="p-2">LOT</th>
                            <th class="p-2">الوقت</th>
                            <th class="p-2 text-center">إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="scanned-table-body" class="divide-y divide-gray-100">
                        <!-- سيتم إضافة الصفوف هنا برمجياً -->
                    </tbody>
                </table>
            </div>

            <!-- أزرار الإجراءات العامة -->
            <div class="flex gap-2">
                <button onclick="exportToExcel()" id="export-btn" disabled class="bg-green-600 hover:bg-green-700 disabled:bg-gray-300 text-white font-bold py-2.5 px-4 rounded-lg shadow w-full transition duration-200 flex items-center justify-center gap-2">
                    📊 تصدير الكل إلى Excel (<span id="export-count">0</span>)
                </button>
            </div>
        </div>
    </div>

    <script>
        let html5QrCode;
        let scannedItems = []; // مصفوفة لتخزين جميع القطع المسحوبة

        function startScanner() {
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('stop-btn').classList.remove('hidden');

            html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 }
                },
                (decodedText, decodedResult) => {
                    processGS1Data(decodedText);
                    // ملحوظة: تم إلغاء stopScanner تلقائياً لتمكين المسح المتتابع السريع، 
                    // لو أردت إيقاف الكاميرا بعد كل مسحة يمكنك إلغاء التعليق عن السطر التالي:
                    // stopScanner(); 
                },
                (errorMessage) => {}
            ).catch((err) => {
                html5QrCode.start(
                    { facingMode: "user" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    (decodedText, decodedResult) => {
                        processGS1Data(decodedText);
                    }
                ).catch(innerErr => {
                    alert("عذراً، لا يمكن الوصول للكاميرا. تأكد من الصلاحيات ووجود رابط HTTPS.");
                    stopScanner();
                });
            });
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('start-btn').classList.remove('hidden');
                    document.getElementById('stop-btn').classList.add('hidden');
                }).catch(err => {
                    console.error("فشل إيقاف الكاميرا", err);
                });
            } else {
                document.getElementById('start-btn').classList.remove('hidden');
                document.getElementById('stop-btn').classList.add('hidden');
            }
        }

        // دالة تحليل باركود GS1
        function processGS1Data(raw) {
            document.getElementById('result-container').classList.remove('hidden');
            document.getElementById('raw-data').innerText = raw;

            let gtin = "غير متوفر";
            let expiry = "غير متوفر";
            let batch = "غير متوفر";
            let now = new Date().toLocaleTimeString('ar-EG');
            let fullTimestamp = new Date().toLocaleString('ar-EG');

            // 1. استخراج GTIN (يبدأ بـ 01 وطوله 14 رقم)
            let gtinIndex = raw.indexOf("01");
            if (gtinIndex !== -1 && raw.length >= gtinIndex + 16) {
                gtin = raw.substring(gtinIndex + 2, gtinIndex + 16);
            }

            // 2. استخراج تاريخ الصلاحية (يبدأ بـ 17 وطوله 6 أرقام YYMMDD)
            let expiryIndex = raw.indexOf("17");
            if (expiryIndex !== -1 && raw.length >= expiryIndex + 8) {
                let yy = raw.substring(expiryIndex + 2, expiryIndex + 4);
                let mm = raw.substring(expiryIndex + 4, expiryIndex + 6);
                let dd = raw.substring(expiryIndex + 6, expiryIndex + 8);
                expiry = `20${yy}-${mm}-${dd}`;
            }

            // 3. استخراج رقم التشغيلة (Batch/LOT) - ما بعد (10) أخذ آخر 8 أرقام فقط
            let batchIndex = raw.indexOf("10");
            if (batchIndex !== -1) {
                let sub = raw.substring(batchIndex + 2);
                // فصل البيانات في حال وجود فاصل FNC1 أو رموز إضافية
                let cleanBatch = sub.split(/[\x1d]/)[0];
                // أخذ آخر 8 أرقام من الجزء الخاص بالتشغيلة
                if (cleanBatch.length >= 8) {
                    batch = cleanBatch.slice(-8);
                } else {
                    batch = cleanBatch; // في حال كان النص أصلاً أقل من 8 أحرف
                }
            }

            // منع تكرار نفس القطعة فوراً وراء بعض لو تم مسحها بالخطأ بالثانية نفسها (اختياري)
            let newItem = {
                id: Date.now(),
                raw: raw,
                gtin: gtin,
                expiry: expiry,
                batch: batch,
                timestamp: fullTimestamp
            };

            // إضافة العنصر لمصفوفة البيانات
            scannedItems.unshift(newItem); // إضافة العنصر الجديد في البداية
            updateTableUI();
        }

        // تحديث واجهة الجدول بناءً على المصفوفة
        function updateTableUI() {
            let tbody = document.getElementById('scanned-table-body');
            tbody.innerHTML = "";

            scannedItems.forEach((item, index) => {
                let row = `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="p-2 font-bold text-gray-500">${scannedItems.length - index}</td>
                        <td class="p-2 font-mono text-blue-600">${item.gtin}</td>
                        <td class="p-2 font-mono text-green-600">${item.expiry}</td>
                        <td class="p-2 font-mono text-purple-600 font-bold">${item.batch}</td>
                        <td class="p-2 text-gray-400">${item.timestamp}</td>
                        <td class="p-2 text-center">
                            <button onclick="removeItem(${item.id})" class="text-red-500 hover:text-red-700 font-bold">❌</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            // تحديث العدادات وأزرار التصدير
            let count = scannedItems.length;
            document.getElementById('items-count').innerText = count;
            document.getElementById('export-count').innerText = count;
            
            let exportBtn = document.getElementById('export-btn');
            if (count > 0) {
                exportBtn.removeAttribute('disabled');
            } else {
                exportBtn.setAttribute('disabled', 'true');
            }
        }

        // حذف عنصر فردي من القائمة
        function removeItem(id) {
            scannedItems = scannedItems.filter(item => item.id !== id);
            updateTableUI();
        }

        // حذف كل العناصر
        function clearAllItems() {
            if (confirm("هل أنت متأكد من حذف جميع القطع المسجلة؟")) {
                scannedItems = [];
                updateTableUI();
                document.getElementById('result-container').classList.add('hidden');
            }
        }

        // دالة إنشاء وتنزيل ملف الإكسيل لجميع القطع
        function exportToExcel() {
            if (scannedItems.length === 0) return;

            let excelData = scannedItems.map((item, index) => ({
                "م": index + 1,
                "كود المنتج (GTIN)": item.gtin,
                "تاريخ الصلاحية": item.expiry,
                "رقم التشغيلة (Batch/LOT)": item.batch,
                "وقت المسح": item.timestamp,
                "الباركود الخام": item.raw
            }));

            let worksheet = XLSX.utils.json_to_sheet(excelData);
            let workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "GS1 Scanned Batch");

            let fileName = `GS1_Batch_Export_${Date.now()}.xlsx`;
            XLSX.writeFile(workbook, fileName);
        }
    </script>
</body>
</html>
