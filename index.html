<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ باركود GS1 احترافي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Html5-Qrcode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-3 md:p-6 relative">

    <!-- إشعار نجاح المسح -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-green-600 text-white px-6 py-3 rounded-xl shadow-2xl font-bold flex items-center gap-2 z-50 transition-all duration-300 opacity-0 pointer-events-none">
        <span>✅ تم السحب بنجاح!</span>
    </div>

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden p-4 md:p-6 space-y-6">
        
        <!-- الهيدر واستيراد القائمة -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-3 border-b pb-4">
            <h2 class="text-2xl font-black text-gray-800">ماسح GS1 الاحترافي 📦</h2>
            
            <!-- استيراد دليل أسماء المنتجات -->
            <label class="cursor-pointer bg-purple-50 hover:bg-purple-100 text-purple-700 border border-purple-200 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
                <span>📂 ربط دليل أسماء المنتجات (Excel)</span>
                <input type="file" id="catalog-file" accept=".xlsx, .xls" onchange="loadProductCatalog(event)" class="hidden">
            </label>
        </div>

        <!-- أزرار التحكم بالكاميرا والكشاف -->
        <div class="grid grid-cols-2 gap-2">
            <button id="start-btn" onclick="startScanner()" class="col-span-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition duration-200">
                📷 ابدأ مسح الباركود
            </button>
            <button id="stop-btn" onclick="stopScanner()" class="hidden bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition duration-200">
                🛑 إيقاف الكاميرا
            </button>
            <button id="torch-btn" onclick="toggleTorch()" class="hidden bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-xl shadow-md transition duration-200">
                💡 تشغيل الكشاف
            </button>
        </div>

        <!-- مكان عرض الكاميرا -->
        <div id="reader" class="w-full rounded-xl overflow-hidden bg-black min-h-[200px]"></div>

        <!-- آخر قطعة تم مسحها -->
        <div id="result-container" class="hidden bg-blue-50/60 border border-blue-100 rounded-xl p-4 space-y-2">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-blue-800 uppercase tracking-wider">📦 آخر قطعة تم مسحها</span>
                <span id="product-name-tag" class="text-xs font-black bg-blue-600 text-white px-2 py-0.5 rounded-md">منتج غير معرف</span>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-2 text-xs text-gray-700 pt-1">
                <div><span class="text-gray-400 block">GTIN:</span> <strong id="gtin-val" class="font-mono text-blue-700"></strong></div>
                <div><span class="text-gray-400 block">الصلاحية:</span> <strong id="expiry-val" class="font-mono text-green-700"></strong></div>
                <div><span class="text-gray-400 block">LOT:</span> <strong id="batch-val" class="font-mono text-purple-700"></strong></div>
            </div>
        </div>

        <!-- جدول المنتجات المجمعة -->
        <div class="border border-gray-200 rounded-xl p-4 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-gray-800">📋 الأصناف المجمعة (<span id="items-count" class="text-blue-600">0</span>)</h3>
                <button onclick="clearAllItems()" class="text-red-500 hover:text-red-700 text-xs font-bold transition">حذف الكل 🗑️</button>
            </div>

            <!-- عرض الجدول -->
            <div class="overflow-x-auto max-h-72 overflow-y-auto rounded-lg border border-gray-100">
                <table class="w-full text-right text-xs">
                    <thead class="bg-gray-100 text-gray-700 sticky top-0">
                        <tr>
                            <th class="p-2.5">المنتج / GTIN</th>
                            <th class="p-2.5">الصلاحية</th>
                            <th class="p-2.5">LOT</th>
                            <th class="p-2.5 text-center">الكمية</th>
                            <th class="p-2.5 text-center">إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="scanned-table-body" class="divide-y divide-gray-100">
                        <!-- الصفوف تُضاف ديناميكياً -->
                    </tbody>
                </table>
            </div>

            <!-- زر التصدير -->
            <button onclick="exportToExcel()" id="export-btn" disabled class="bg-green-600 hover:bg-green-700 disabled:bg-gray-300 text-white font-bold py-3 px-4 rounded-xl shadow-lg w-full transition duration-200 flex items-center justify-center gap-2">
                📊 تصدير القائمة المجمعة إلى Excel
            </button>
        </div>
    </div>

    <script>
        let html5QrCode;
        let scannedGroups = {}; // التجميع التلقائي بناءً على المفتاح
        let productCatalog = {}; // دليل أسماء المنتجات { gtin: "اسم المنتج" }
        let isTorchOn = false;
        let lastScannedText = "";
        let lastScannedTime = 0;

        // دالة إنشاء الصوت لملاحظة المسح الناجح
        function playBeepSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1800, ctx.currentTime); 
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            } catch (e) {
                console.log("Audio not supported");
            }
        }

        // قراءة دليل أسماء المنتجات من ملف إكسيل
        function loadProductCatalog(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                // افترض أن الملف يحتوي على أعمدة باسم (GTIN) و (Name أو اسم المنتج)
                productCatalog = {};
                jsonData.forEach(row => {
                    let gtinKey = row['GTIN'] || row['gtin'] || row['كود المنتج'];
                    let nameVal = row['Name'] || row['name'] || row['اسم المنتج'] || row['الاسم'];
                    if (gtinKey && nameVal) {
                        productCatalog[String(gtinKey).trim()] = String(nameVal).trim();
                    }
                });

                alert(`تم تحميل ${Object.keys(productCatalog).length} منتج بنجاح من الدليل!`);
                updateTableUI();
            };
            reader.readAsArrayBuffer(file);
        }

        function startScanner() {
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('stop-btn').classList.remove('hidden');

            html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    let nowMs = Date.now();
                    if (decodedText === lastScannedText && (nowMs - lastScannedTime) < 1800) return;
                    
                    lastScannedText = decodedText;
                    lastScannedTime = nowMs;

                    processGS1Data(decodedText);
                    triggerSuccessFeedback();
                },
                () => {}
            ).then(() => {
                // إظهار زر الكشاف إذا كان الجهاز يدعمه
                checkTorchSupport();
            }).catch(() => {
                alert("تعذر فتح الكاميرا، يرجى التأكد من الصلاحيات ووجود اتصال آمن (HTTPS).");
                stopScanner();
            });
        }

        function checkTorchSupport() {
            try {
                const capabilities = html5QrCode.getRunningTrackCapabilities();
                if (capabilities.torch) {
                    document.getElementById('torch-btn').classList.remove('hidden');
                }
            } catch(e) {}
        }

        function toggleTorch() {
            isTorchOn = !isTorchOn;
            html5QrCode.applyVideoConstraints({
                advanced: [{ torch: isTorchOn }]
            });
            document.getElementById('torch-btn').innerText = isTorchOn ? "💡 إطفاء الكشاف" : "💡 تشغيل الكشاف";
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    resetScannerUI();
                });
            } else {
                resetScannerUI();
            }
        }

        function resetScannerUI() {
            document.getElementById('start-btn').classList.remove('hidden');
            document.getElementById('stop-btn').classList.add('hidden');
            document.getElementById('torch-btn').classList.add('hidden');
            isTorchOn = false;
        }

        function triggerSuccessFeedback() {
            playBeepSound();
            if (navigator.vibrate) navigator.vibrate(100);

            let toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 1400);
        }

        function processGS1Data(raw) {
            document.getElementById('result-container').classList.remove('hidden');

            let gtin = "غير متوفر";
            let expiry = "غير متوفر";
            let batch = "غير متوفر";

            let gtinIndex = raw.indexOf("01");
            if (gtinIndex !== -1 && raw.length >= gtinIndex + 16) {
                gtin = raw.substring(gtinIndex + 2, gtinIndex + 16);
            }

            let expiryIndex = raw.indexOf("17");
            if (expiryIndex !== -1 && raw.length >= expiryIndex + 8) {
                let yy = raw.substring(expiryIndex + 2, expiryIndex + 4);
                let mm = raw.substring(expiryIndex + 4, expiryIndex + 6);
                let dd = raw.substring(expiryIndex + 6, expiryIndex + 8);
                expiry = `20${yy}-${mm}-${dd}`;
            }

            let batchIndex = raw.indexOf("10");
            if (batchIndex !== -1) {
                let sub = raw.substring(batchIndex + 2);
                let cleanBatch = sub.split(/[\x1d]/)[0];
                batch = cleanBatch.length >= 8 ? cleanBatch.slice(-8) : cleanBatch;
            }

            let productName = productCatalog[gtin] || "منتج غير معرف";

            document.getElementById('gtin-val').innerText = gtin;
            document.getElementById('expiry-val').innerText = expiry;
            document.getElementById('batch-val').innerText = batch;
            document.getElementById('product-name-tag').innerText = productName;

            // مفتاح التجميع الموحد
            let groupKey = `${gtin}_${expiry}_${batch}`;

            if (scannedGroups[groupKey]) {
                scannedGroups[groupKey].quantity += 1;
            } else {
                scannedGroups[groupKey] = {
                    gtin: gtin,
                    expiry: expiry,
                    batch: batch,
                    name: productName,
                    quantity: 1,
                    raw: raw
                };
            }

            updateTableUI();
        }

        function updateQuantity(key, delta) {
            if (scannedGroups[key]) {
                scannedGroups[key].quantity += delta;
                if (scannedGroups[key].quantity <= 0) {
                    delete scannedGroups[key];
                }
                updateTableUI();
            }
        }

        function updateTableUI() {
            let tbody = document.getElementById('scanned-table-body');
            tbody.innerHTML = "";

            let keys = Object.keys(scannedGroups);

            keys.forEach((key) => {
                let item = scannedGroups[key];
                let displayName = productCatalog[item.gtin] || item.name;

                let row = `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="p-2.5">
                            <div class="font-bold text-gray-800">${displayName}</div>
                            <div class="font-mono text-[10px] text-blue-600">${item.gtin}</div>
                        </td>
                        <td class="p-2.5 font-mono text-green-700 font-medium">${item.expiry}</td>
                        <td class="p-2.5 font-mono text-purple-700 font-bold">${item.batch}</td>
                        <td class="p-2.5 text-center">
                            <div class="inline-flex items-center border border-gray-200 rounded-lg bg-gray-50 overflow-hidden">
                                <button onclick="updateQuantity('${key}', -1)" class="px-2 py-1 text-red-600 hover:bg-gray-200 font-bold">-</button>
                                <span class="px-3 font-bold text-gray-800 text-xs">${item.quantity}</span>
                                <button onclick="updateQuantity('${key}', 1)" class="px-2 py-1 text-green-600 hover:bg-gray-200 font-bold">+</button>
                            </div>
                        </td>
                        <td class="p-2.5 text-center">
                            <button onclick="deleteGroup('${key}')" class="text-red-400 hover:text-red-600 font-bold">🗑️</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            let count = keys.length;
            document.getElementById('items-count').innerText = count;
            
            let exportBtn = document.getElementById('export-btn');
            if (count > 0) {
                exportBtn.removeAttribute('disabled');
            } else {
                exportBtn.setAttribute('disabled', 'true');
            }
        }

        function deleteGroup(key) {
            delete scannedGroups[key];
            updateTableUI();
        }

        function clearAllItems() {
            if (confirm("هل أنت متأكد من مسح جميع الأصناف المسجلة؟")) {
                scannedGroups = {};
                updateTableUI();
                document.getElementById('result-container').classList.add('hidden');
            }
        }

        function exportToExcel() {
            let items = Object.values(scannedGroups);
            if (items.length === 0) return;

            let excelData = items.map((item, index) => ({
                "م": index + 1,
                "اسم المنتج": productCatalog[item.gtin] || item.name,
                "كود المنتج (GTIN)": item.gtin,
                "تاريخ الصلاحية": item.expiry,
                "رقم التشغيلة (Batch/LOT)": item.batch,
                "الكمية الممسوحة": item.quantity,
                "الباركود الخام": item.raw
            }));

            let worksheet = XLSX.utils.json_to_sheet(excelData);
            let workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "تقرير المخزون المجمع");

            XLSX.writeFile(workbook, `GS1_Inventory_${Date.now()}.xlsx`);
        }
    </script>
</body>
</html>
